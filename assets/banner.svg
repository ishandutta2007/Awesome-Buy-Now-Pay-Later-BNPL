<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>

    <!-- Floating Orbs Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-15px) translateX(12px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes nodeGlow {
        0%, 100% { fill-opacity: 0.4; r: 4; }
        50% { fill-opacity: 0.9; r: 6.5; }
      }
      .floating-orb-1 {
        animation: floatSlow 8s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .floating-orb-2 {
        animation: floatSlow 10s ease-in-out infinite alternate-reverse;
        transform-origin: center;
      }
      .pulsing-wave {
        animation: pulseLight 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashAnim 12s linear infinite;
      }
      .dynamic-node {
        animation: nodeGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Ambient Spheres (Behind Content) -->
  <g class="floating-orb-1">
    <circle cx="180" cy="110" r="110" fill="#0284c7" opacity="0.22" filter="url(#glowCyan)" />
  </g>
  <g class="floating-orb-2">
    <circle cx="1020" cy="280" r="130" fill="#7c3aed" opacity="0.25" filter="url(#glowPurple)" />
  </g>
  <circle cx="600" cy="70" r="90" fill="#4f46e5" opacity="0.15" class="pulsing-wave" filter="url(#glowPurple)" />

  <!-- Ambient Dynamic Circuit Flow Lines (Background Decoration) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 80 340 C 260 300, 320 380, 520 330 S 820 350, 1120 310" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="flow-line" d="M 120 80 C 350 140, 500 50, 780 100 S 980 70, 1100 130" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <!-- Dynamic Signal Nodes -->
    <circle cx="320" cy="345" class="dynamic-node" fill="#38bdf8" />
    <circle cx="520" cy="330" class="dynamic-node" fill="#818cf8" style="animation-delay: 1s;" />
    <circle cx="820" cy="340" class="dynamic-node" fill="#c084fc" style="animation-delay: 2s;" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Badge / Pill -->
  <g transform="translate(435, 45)">
    <rect width="330" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#10b981" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">
      CURATED ECOSYSTEM <tspan fill="#38bdf8">•</tspan> OPEN-SOURCE &amp; SAAS
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryTextGrad)" letter-spacing="-0.8">
    Awesome Buy Now Pay Later (BNPL)
  </text>

  <!-- Subtitle & Key Value Proposition -->
  <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Comprehensive directory of Installment Lending Engines, Checkout Orchestration &amp; Fintech Infrastructure
  </text>

  <!-- Dynamic Feature Badges / Cards in Foreground -->
  <g transform="translate(140, 240)">
    <!-- Pill 1: Commercial Networks -->
    <g transform="translate(0, 0)">
      <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#0369a1" fill-opacity="0.4" />
      <text x="36" y="42" text-anchor="middle" font-size="18">💳</text>
      <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">BNPL Networks</text>
      <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">Klarna, Affirm, Afterpay</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Valuation &amp; MDR Pricing →</text>
    </g>

    <!-- Pill 2: Payment Orchestration -->
    <g transform="translate(235, 0)">
      <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#4338ca" fill-opacity="0.4" />
      <text x="36" y="42" text-anchor="middle" font-size="18">⚡</text>
      <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Orchestration</text>
      <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">Hyperswitch &amp; Kill Bill</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#818cf8">Smart Routing &amp; SDKs →</text>
    </g>

    <!-- Pill 3: Loan Servicing Engines -->
    <g transform="translate(470, 0)">
      <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#6d28d9" fill-opacity="0.4" />
      <text x="36" y="42" text-anchor="middle" font-size="18">🏦</text>
      <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Lending Systems</text>
      <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">Apache Fineract &amp; Frappe</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc">Amortization &amp; Servicing →</text>
    </g>

    <!-- Pill 4: Open Architecture -->
    <g transform="translate(705, 0)">
      <rect width="215" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#0f766e" fill-opacity="0.4" />
      <text x="36" y="42" text-anchor="middle" font-size="18">🌟</text>
      <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Open-Source Hub</text>
      <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">Community Verified</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">Ranked By Stars →</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)" rx="2" />
</svg>